<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحميل تطبيق تهادوا</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/fav.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #f8f4ef 0%, #ffffff 100%);
      color: #2b2b2b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-blur {
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(198, 155, 109, 0.15);
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
    }

    .bg1 {
      top: -180px;
      right: -120px;
    }

    .bg2 {
      bottom: -200px;
      left: -120px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 40px 24px;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 60px;
    }

    .logo {
      height: 70px;
      object-fit: contain;
    }

    .hero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 60px;
      align-items: center;
    }

    .content h1 {
      font-size: 58px;
      line-height: 1.2;
      margin-bottom: 20px;
      font-weight: 800;
      color: #1f1f1f;
    }

    .content p {
      font-size: 20px;
      color: #666;
      line-height: 1.9;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 30px;
    }

    .store-btn {
      background: #111;
      color: white;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.3s ease;
      font-size: 16px;
      font-weight: 600;
      min-width: 220px;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .store-btn:hover {
      transform: translateY(-4px);
      background: linear-gradient(135deg, rgba(234,122,168,.92), rgba(130,170,244,.70))
    }

    .store-btn span {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .store-btn small {
      font-size: 12px;
      opacity: 0.7;
      font-weight: 400;
    }

    .phone-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 40px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      position: relative;
    }

    .phone-image {
      width: 320px;
      max-width: 100%;
      border-radius: 28px;
      display: block;
    }

    .qr-box {
      position: absolute;
      bottom: -40px;
      left: -40px;
      background: white;
      padding: 18px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      text-align: center;
      width: 180px;
    }

    .qr-box img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .qr-box p {
      font-size: 14px;
      color: #666;
      line-height: 1.7;
      font-weight: 600;
    }

    .features {
      margin-top: 140px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
    }

    .feature-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 12px 40px rgba(0,0,0,0.05);
      transition: 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-6px);
    }

    .feature-icon {
      width: 60px;
      height: 60px;
      background: rgba(198, 155, 109, 0.15);
      color: #c69b6d;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 18px;
    }

    .feature-card h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .feature-card p {
      color: #666;
      line-height: 1.8;
      font-size: 15px;
    }

    footer {
      text-align: center;
      margin-top: 80px;
      padding-bottom: 30px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .content {
        text-align: center;
      }

      .content h1 {
        font-size: 42px;
      }

      .content p {
        font-size: 18px;
      }

      .buttons {
        justify-content: center;
      }

      .qr-box {
        position: relative;
        left: auto;
        bottom: auto;
        margin: 20px auto 0;
      }

      .features {
        margin-top: 80px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blur bg1"></div>
  <div class="bg-blur bg2"></div>

  <div class="container">

   <header>
  <a href="https://tahado.sa" target="_blank" rel="noopener noreferrer">
    <img src="assets/Logo.png" alt="Tahado" class="logo">
  </a>
</header>
<br><br>
    <section class="hero">

      <div class="content">
        <h1>
          حمّل تطبيق تهادوا<br>
          وابدأ تجربة إهداء استثنائية
        </h1>

        <p>
          اكتشف أجمل الهدايا، خصّص طلباتك بسهولة، وأرسل الهدايا لمن تحب بطريقة أنيقة وسريعة عبر تطبيق تهادوا.
        </p>

        <div class="buttons">

          <a href="https://apps.apple.com/us/app/6742783552" class="store-btn">
            <span>
              <small>Download on the</small>
              App Store
            </span>
          </a>

          <a href="https://play.google.com/store/apps/details?id=com.masader.tahaddoo" class="store-btn">
            <span>
              <small>GET IT ON</small>
              Google Play
            </span>
          </a>

        </div>

      </div>

      <div class="phone-wrapper">

        <div class="phone-card">
          <img src="assets/phone1.png" class="phone-image" alt="Tahado App">

          <div class="qr-box">
            <img src="assets/qr-code.png" alt="QR Code">
            <p>
              امسح الكود لتحميل التطبيق مباشرة
            </p>
          </div>

        </div>

      </div>

    </section>

    <section class="features">

  
        <p>
        </p>
      </div>


        </p>
      </div>

    </section>

    <footer>
      © 2026 Tahado — جميع الحقوق محفوظة
    </footer>

  </div>

</body>
</html>
